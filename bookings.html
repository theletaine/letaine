<body>
	<header>
			<div class="w-100 textdark" id="bookingsheader">
						<h3>The letaine</h3>
			</div>
			<div id="bookingticket">
				<div id="bookingselect">
					<div id="onewaybutton" class="buttondarkselect">one way</div>
					<div id="roundtripbutton" class="buttondarkselect">round trip</div>
				</div>
				<form>
				<fieldset>
				<div class="form-row w-100">
					<input type="text" id="nameTextInput" class="form-control" placeholder="Full Name">
				  </div>
				  <div class="form-row w-100">
					<select id="departureSelect" class="form-select">
						<option hidden>Select Departure</option>
						  <option>Shanterill</option>
						  <option>Frasia</option>
						  <option>Gyrun'jir</option>
						  <option>Tiluraen</option>
						  <option>Riesling</option>
						</select>
						<input type="text" id="destinationTextInput" class="form-control" placeholder="Destination">
				  	</div>				  
				</fieldset>
				<!-- Button Trigger Modal -->
				<br>
			  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal">
				book ticket
			  </button>
			  </form>
			  <p style="color: #4D2020;"><br>Can't pay? Consult the steward upon boarding to find alternatives.</p>
			</div>
			<!-- Modal that pops up to confirm booking -->
			<div class="modal fade" id="bookingModal" tabindex="-1" role="dialog" aria-labelledby="bookingTicketModal" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered" role="document">
				  <div class="modal-content">
					<div class="modal-header">
					  <h3 class="modal-title" id="exampleModalLongTitle">Thank you for booking!</h3>
					  <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					  </button>
					</div>
					<div class="modal-body">
					  Please feel free to close and refresh the page.
					</div>
					<div class="modal-footer">
					  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					</div>
				  </div>
				</div>
			</div>
	</header>
