				</div>
				  <div class="row">
					<div class="mb-3">
						<input type="text" id="destinationTextInput" class="form-control" placeholder="Destination">
				  	</div>
				  </div>
				  <button type="submit" class="btn btn-primary" data-toggle="modal" data-target="#bookingModal">book ticket</button>
				</fieldset>
			  </form>
			</div>
